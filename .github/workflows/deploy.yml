name: Deploy ke Hosting

# Continuous Deployment ke shared hosting / cPanel TANPA SSH (mis. Rumahweb Small).
#
# Cara kerja:
#   1. GitHub Actions membangun aplikasi (composer install --no-dev) di runner.
#   2. Hasilnya dipaketkan jadi satu berkas release.zip.
#   3. Zip diunggah lewat FTP/FTPS ke folder ~/deploy/ di hosting.
#   4. Workflow memanggil public_html/deploy.php untuk mengekstrak + migrasi.
#
# Aktifkan dengan repository variable DEPLOY_ENABLED=true dan secret:
#   FTP_HOST, FTP_USER, FTP_PASS, DEPLOY_URL, DEPLOY_TOKEN
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ke hosting (FTP)
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      # Versi PHP disamakan dengan yang tersedia di hosting (Rumahweb Small: PHP 8.2)
      # supaya paket di vendor/ cocok dengan server.
      - name: Siapkan PHP 8.2 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, curl, fileinfo, pdo_mysql, gd, zip, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache dependensi Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-deploy-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Pasang dependensi produksi
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader \
            --no-interaction --no-progress
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Paketkan rilis
        run: |
          zip -rq release.zip . \
            -x '.git/*' '.github/*' '.env' '.env.*' 'tests/*' 'deploy/*' 'node_modules/*' \
               'storage/logs/*' 'storage/framework/cache/*' 'storage/framework/sessions/*' \
               'storage/framework/views/*' 'bootstrap/cache/*' '*.sqlite' \
               '.phpunit.cache/*' '.phpunit.result.cache' 'release.zip'
          echo "Ukuran rilis: $(du -h release.zip | cut -f1)"

      - name: Unggah ke hosting (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          curl --fail --silent --show-error \
            --ssl-reqd \
            --user "$FTP_USER:$FTP_PASS" \
            --ftp-create-dirs \
            --upload-file release.zip \
            "ftp://$FTP_HOST/deploy/release.zip"
          echo "Unggahan selesai."

      - name: Ekstrak & migrasi di hosting
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          response=$(curl --fail --silent --show-error --max-time 300 \
            "$DEPLOY_URL?token=$DEPLOY_TOKEN")

          echo "$response"

          # deploy.php membalas {"ok":true,...} bila berhasil.
          echo "$response" | grep -q '"ok":true' || {
            echo "::error::Deploy gagal, lihat keluaran di atas."
            exit 1
          }

      - name: Ringkasan hasil
        if: always()
        run: |
          {
            echo "### Deploy ke hosting"
            echo ""
            echo "- Metode: **FTP/FTPS** (tanpa SSH)"
            echo "- PHP target: **8.2** (versi hosting)"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
