name: Backend Deploy

# Continuous Deployment (opsional).
# Baru berjalan kalau di repositori GitHub diatur:
#   Settings > Secrets and variables > Actions > Variables
#   DEPLOY_ENABLED = true
# dan secret SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_PATH sudah diisi.
# Kalau belum diatur, job ini dilewati (bukan gagal).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ke server produksi
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Deploy lewat SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard "${{ github.sha }}"
            composer install --no-dev --prefer-dist --no-interaction --no-progress
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            echo "Deploy selesai: ${{ github.sha }}"
